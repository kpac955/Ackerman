{% extends 'catalog/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Блог</h1>
    <a href="{% url 'blog:create' %}" class="btn btn-primary">Написать статью</a>
</div>
<div class="row row-cols-1 row-cols-md-2 g-4">
    {% for object in object_list %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            {% if object.preview %}
            <img src="{{ object.preview.url }}" class="card-img-top" alt="{{ object.title }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ object.title }}</h5>
                <p class="card-text text-muted">{{ object.content|truncatechars:100 }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'blog:view' object.pk %}" class="btn btn-outline-primary">Читать</a>
                    <small class="text-muted"><i class="bi bi-eye"></i> {{ object.views_count }}</small>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
