{% extends 'catalog/base.html' %}
{% block content %}
<article class="p-4 border rounded bg-white shadow-sm">
    {% if object.preview %}
    <img src="{{ object.preview.url }}" class="img-fluid rounded mb-4" alt="{{ object.title }}">
    {% endif %}
    <h1 class="display-4">{{ object.title }}</h1>
    <p class="text-muted">Опубликовано: {{ object.created_at|date:"d.m.Y" }} | Просмотров: {{ object.views_count }}</p>
    <hr>
    <div class="lead mb-4">{{ object.content|linebreaks }}</div>
    <div class="d-flex gap-2">
        <a href="{% url 'blog:list' %}" class="btn btn-secondary">Назад к списку</a>
        <a href="{% url 'blog:edit' object.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:delete' object.pk %}" class="btn btn-danger">Удалить</a>
    </div>
</article>
{% endblock %}
