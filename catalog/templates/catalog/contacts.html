{% extends 'catalog/base.html' %} {% block content %} <div class="text-center mb-5">
        <h1 class="display-4 fw-normal">Контакты</h1>
    </div>

    <div class="row g-5">
        <div class="col-md-6">
            <form method="post" class="p-4 border rounded shadow-sm bg-white">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Сообщение</label>
                    <textarea name="message" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить данные</button>
            </form>
        </div>
        <div class="col-md-6">
            <h3>Свяжитесь с нами</h3>
            <p>г.Саратов, ул Октябрьская 40, дом 1.</p>
            <p> Джон Уик "Бугимен" - 8-999-999-99-99.</p>
        </div>
    </div>
{% endblock %}
