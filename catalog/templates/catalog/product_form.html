{% extends 'catalog/base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2>{% if object %}Редактировать{% else %}Добавить{% endif %} продукт</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{% url 'catalog:home' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
