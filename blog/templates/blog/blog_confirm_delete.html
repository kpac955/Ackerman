{% extends 'catalog/base.html' %}
{% block content %}
<div class="alert alert-danger shadow">
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить статью <strong>"{{ object.title }}"</strong>?</p>
        <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
        <a href="{% url 'blog:view' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
