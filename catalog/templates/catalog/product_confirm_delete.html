{% extends 'catalog/base.html' %}
{% block content %}
<div class="alert alert-warning">
    <form method="post">
        {% csrf_token %}
        <p>Вы действительно хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>
        <button type="submit" class="btn btn-danger">Удалить окончательно</button>
        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
